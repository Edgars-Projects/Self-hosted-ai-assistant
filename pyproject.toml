[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "self-hosted-ai-assistant"
version = "1.1.0"
description = "Self-hosted agentic AI assistant for Telegram, powered by local LLMs via Ollama."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "python-telegram-bot>=20.0",
    "APScheduler>=3.10,<4",
    "beautifulsoup4>=4.12",
    "numpy>=1.24",
    "pypdf>=4.0",
    "nest_asyncio>=1.5",
    "yt-dlp",
    "reportlab>=4.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
voice = ["faster-whisper>=1.0", "edge-tts>=6.1"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "types-requests"]

[project.scripts]
assistant = "assistant.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
files = [
    "src/assistant/config.py",
    "src/assistant/util.py",
    "src/assistant/db.py",
    "src/assistant/secrets.py",
    "src/assistant/installers.py",
    "src/assistant/tools",
]
ignore_missing_imports = true
follow_imports = "silent"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F", "I"]
